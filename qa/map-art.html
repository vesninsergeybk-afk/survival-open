<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка оформления карты</title>
<style>body{margin:0;background:#18252f;color:#c9d9df;font:13px system-ui}nav{padding:9px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}a{color:#dce8d7}button{padding:8px;background:#233f4c;border:1px solid #6f8c99;color:#e0e8e3;cursor:pointer}iframe{box-sizing:border-box;display:block;width:100%;height:calc(100vh - 85px);margin:0 auto;border:1px solid #667f8c;max-width:100%}p{margin:0 10px 8px;font-size:11px}</style>
<nav><a href="map-art-scene.html?mode=overview" target="stage">Обзор</a><a href="map-art-scene.html?mode=network" target="stage">Развитая сеть</a><a href="map-art-scene.html?mode=local" target="stage">Ближняя карта</a><a href="map-art-scene.html?mode=targets" target="stage">Список</a><button data-size="full">Всё окно</button><button data-size="360">360 × 740</button><button data-size="412">412 × 915</button><button data-size="915">915 × 412</button></nav>
<p>Визуальный стенд: те же функции карты и подготовленные состояния мира. Сохранение игрока не используется.</p><iframe name="stage" title="Карта игры" src="map-art-scene.html?mode=overview"></iframe>
<script>document.querySelector('nav').addEventListener('click',e=>{const id=e.target.dataset.size;if(!id)return;const frame=document.querySelector('iframe'),sizes={360:740,412:915,915:412};frame.style.width=id==='full'?'100%':id+'px';frame.style.height=id==='full'?'calc(100vh - 85px)':sizes[id]+'px';});</script></html>
