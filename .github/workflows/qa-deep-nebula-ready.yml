name: Validate deep-space art after browser image readiness
on:
  push:
    branches: [feature/deep-space-art-20261116]
    paths: [.github/workflows/qa-deep-nebula-ready.yml]
permissions: {contents: write}
jobs:
  verify-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA adapter
        run: |
          mkdir -p /tmp/sbs-qa
          cd /tmp/sbs-qa
          npm init -y >/dev/null
          npm install --silent --no-save puppeteer-core@24
      - name: Capture five sectors and compare to original without race conditions
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium)
          python -m http.server 8787 --bind 127.0.0.1 >/tmp/deepspace-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          cat >/tmp/sbs-qa/capture.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import {writeFileSync} from 'node:fs';
          const browser=await puppeteer.launch({
           executablePath:process.env.CHROME,
           headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
          });
          const results=[];
          for(const sector of [0,1,2,3,4,5]){
           const page=await browser.newPage();
           await page.setViewport({width:1280,height:720,deviceScaleFactor:1});
           const query=sector===5?'sector=0&skytexture=off':'sector='+sector;
           await page.goto('http://127.0.0.1:8787/arcade/tests/deep-nebula-preview.html?'+query,
            {waitUntil:'networkidle0',timeout:30000});
           await page.waitForFunction(()=>document.body.dataset.skyReady==='1',{timeout:15000});
           const state=JSON.parse(await page.$eval('#state',el=>el.textContent));
           console.log('SECTOR',sector,JSON.stringify(state));
           if(sector!==5&&(!state.ready||!state.pattern||state.texture!=='ready')){
            throw new Error('Missing cloud texture in sector '+sector);
           }
           await page.screenshot({path:sector===5?'/tmp/sbs-before.png':
             '/tmp/sbs-scene-'+sector+'.png'});
           results.push(state);await page.close();
          }
          writeFileSync('assets/space/deep-nebula/browser-states.json',
           JSON.stringify(results,null,2));
          await browser.close();
          NODE
          CHROME="$CHROME" node /tmp/sbs-qa/capture.mjs
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import numpy as np,json
          root=Path('assets/space/deep-nebula')
          board=Image.new('RGB',(1200,1260),(9,16,29))
          draw=ImageDraw.Draw(board)
          names=['AMETHYST','AZURE','AMBER','LILAC','TEAL','BEFORE / no cloud detail']
          paths=[Path(f'/tmp/sbs-scene-{i}.png') for i in range(5)]+[Path('/tmp/sbs-before.png')]
          for i,path in enumerate(paths):
              im=Image.open(path).convert('RGB').resize((580,326),Image.Resampling.LANCZOS)
              x=(i%2)*600+10;y=(i//2)*418+10
              board.paste(im,(x,y));draw.text((x+9,y+332),names[i],fill=(215,237,246))
          board.save(root/'integration-review.jpg',quality=87,optimize=True)
          after=np.asarray(Image.open(paths[0]).convert('RGB'),dtype=np.int16)
          before=np.asarray(Image.open(paths[5]).convert('RGB'),dtype=np.int16)
          delta=np.abs(after-before)
          report={'avg_channel_delta':round(float(delta.mean()),3),
           'changed_pixel_fraction':round(float(np.mean(np.max(delta,axis=2)>5)),4),
           'max_pixel_delta':int(delta.max())}
          print('BEFORE_AFTER_PIXELS',report)
          (root/'integration-diff.json').write_text(json.dumps(report,indent=2))
          assert report['changed_pixel_fraction']>.03,'new nebula layer does not visibly render'
          PY
      - name: Commit review evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/space/deep-nebula/browser-states.json assets/space/deep-nebula/integration-review.jpg assets/space/deep-nebula/integration-diff.json
          git diff --cached --quiet && exit 0
          git commit -m 'Verify five nebula layers load and change rendered browser pixels'
          git push origin HEAD:feature/deep-space-art-20261116
