name: Make small visual preview of asteroid candidates
on:
  push:
    branches:
      - feature/asteroid-landscape-variants-20261116
    paths:
      - .github/workflows/make-varka-previews.yml
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Create small contact sheet without changing licensed sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          sources=sorted(Path('assets/space/varkalandar').glob('planetoids-*.png'))
          assert len(sources)==4
          board=Image.new('RGB',(1440,1040),(8,17,30))
          d=ImageDraw.Draw(board)
          for i,path in enumerate(sources):
              im=Image.open(path).convert('RGBA')
              orig=im.size
              im.thumbnail((704,488),Image.Resampling.LANCZOS)
              cellx=(i%2)*720;celly=(i//2)*520
              bg=Image.new('RGBA',im.size,(16,24,39,255))
              bg.alpha_composite(im)
              board.paste(bg.convert('RGB'),(cellx+(720-im.width)//2,celly+20))
              d.text((cellx+18,celly+3),f'{path.name} original {orig[0]} x {orig[1]}',fill=(200,228,242))
              print(path.name,orig,im.size)
          out=Path('assets/space/varkalandar/preview-contact.jpg')
          board.save(out,quality=85,optimize=True)
          print('Preview bytes',out.stat().st_size)
          assert out.stat().st_size<950_000
          PY
      - name: Commit review preview
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/space/varkalandar/preview-contact.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Generate compact preview of Varkalandar 24 large asteroids'
            git push origin HEAD:feature/asteroid-landscape-variants-20261116
          fi
