name: Review actual cosmic overlays in headless browser
on:
  push:
    branches: [feature/deep-space-art-20261116]
    paths: [.github/workflows/preview-sbs-nebulae.yml]
permissions: {contents: write}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render all five worlds with real sky and Canvas in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy
          CHROME=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          python -m http.server 8787 --bind 127.0.0.1 >/tmp/deepspace-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          for i in 0 1 2 3 4; do
            timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 \
              --virtual-time-budget=4400 --window-size=1280,720 \
              --screenshot="/tmp/sbs-scene-$i.png" \
              "http://127.0.0.1:8787/arcade/tests/deep-nebula-preview.html?sector=$i" \
              >/tmp/chrome-$i.log 2>&1
            test -s "/tmp/sbs-scene-$i.png"
          done
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 \
              --virtual-time-budget=4400 --window-size=1280,720 \
              --screenshot="/tmp/sbs-before.png" \
              'http://127.0.0.1:8787/arcade/tests/deep-nebula-preview.html?sector=0&skytexture=off' \
              >/tmp/chrome-before.log 2>&1
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4400 \
              --dump-dom 'http://127.0.0.1:8787/arcade/tests/deep-nebula-preview.html?sector=0' \
              >/tmp/sbs-dom.txt 2>/tmp/sbs-domerr.log
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          board=Image.new('RGB',(1200,1260),(9,16,29))
          draw=ImageDraw.Draw(board)
          names=['AMETHYST','AZURE','AMBER','LILAC','TEAL','BEFORE / no cloud detail']
          paths=[Path(f'/tmp/sbs-scene-{i}.png') for i in range(5)]+[Path('/tmp/sbs-before.png')]
          for i,path in enumerate(paths):
              im=Image.open(path).convert('RGB')
              thumb=im.resize((580,326),Image.Resampling.LANCZOS)
              x=(i%2)*600+10
              y=(i//2)*418+10
              board.paste(thumb,(x,y))
              draw.text((x+9,y+332),names[i],fill=(215,237,246))
          out=Path('assets/space/deep-nebula/integration-review.jpg')
          out.parent.mkdir(parents=True,exist_ok=True)
          board.save(out,quality=86,optimize=True)
          print('Integration preview bytes',out.stat().st_size)
          # Same landing sector without / with the optional cloud layer.
          import numpy as np,json
          before=np.asarray(Image.open('/tmp/sbs-before.png').convert('RGB'),dtype=np.int16)
          after=np.asarray(Image.open('/tmp/sbs-scene-0.png').convert('RGB'),dtype=np.int16)
          delta=np.abs(after-before)
          report={'avg_channel_delta':round(float(delta.mean()),3),
           'changed_pixel_fraction':round(float(np.mean(np.max(delta,axis=2)>5)),4),
           'max_pixel_delta':int(delta.max()),'preview_shape':list(before.shape)}
          print('SKY_BEFORE_AFTER',json.dumps(report))
          (out.parent/'integration-diff.json').write_text(json.dumps(report,indent=2))
          import re,html
          raw=Path('/tmp/sbs-dom.txt').read_text(errors='ignore')
          match=re.search(r'<output id="state" hidden="">(.*?)</output>',raw,re.S)
          if not match:match=re.search(r'<output id="state"[^>]*>(.*?)</output>',raw,re.S)
          state=html.unescape(match.group(1)) if match else 'NOT_FOUND'
          (out.parent/'browser-state.txt').write_text(state)
          print('BROWSER_STATE:',state[:2000])


          PY
      - name: Commit visual review
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/space/deep-nebula/integration-review.jpg assets/space/deep-nebula/integration-diff.json assets/space/deep-nebula/browser-state.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Capture real browser composition of all five nebula skies'
          git push origin HEAD:feature/deep-space-art-20261116
