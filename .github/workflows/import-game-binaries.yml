name: Import verified Survivor assets

on:
  push:
    branches:
      - migration/production-20261103
    paths:
      - .github/workflows/import-game-binaries.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survival-asset-import
  cancel-in-progress: false

jobs:
  recover-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Download only checksum-matching files
        run: python3 tools/import_public_assets.py

      - name: Commit verified assets and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets audio-lab prologue migration/binary-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import checksum-verified Survivor binary assets"
            git push origin HEAD:refs/heads/migration/production-20261103
          fi

      - name: Fail if source assets could not be verified
        run: |
          python3 -c 'import json,sys; d=json.load(open("migration/binary-import-report.json")); print("Verified", d["attempted"]-d["failed"], "of", d["attempted"]); sys.exit(1 if d["failed"] else 0)'
