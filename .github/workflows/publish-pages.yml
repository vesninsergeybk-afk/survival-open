name: Publish Survivor arcade

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/publish-pages.yml"
      - "tools/verify-pages-bundle.mjs"
      - "index.html"
      - "arcade/**"
      - "src/**"
      - "audio-lab/**"
      - "assets/**"
      - "visual-lab/**"
      - "asset-gallery.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: survivor-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate arcade before publication
        run: node --test arcade/tests/*.test.mjs

      - name: Verify public sound catalog and permitted recordings
        run: node audio-lab/smoke-test.mjs

      - name: Prepare standalone static game
        run: |
          mkdir -p _site/arcade
          cp index.html .nojekyll _site/
          cp asset-gallery.html _site/
          cp -R arcade/. _site/arcade/
          cp -R assets _site/assets
          cp -R src audio-lab _site/
          cp asset-gallery.html _site/asset-gallery.html
          mkdir -p _site/visual-lab
          cp -R visual-lab/. _site/visual-lab/
          test -f _site/arcade/index.html
          test -f _site/asset-gallery.html
          test -f _site/visual-lab/index.html
          test -f _site/assets/space/hero-evolution/ship_10_damaged.png || test -f _site/assets/space/hero-evolution/ship_10_damaged.webp

      - name: Verify deployed module and resource dependencies
        run: node tools/verify-pages-bundle.mjs _site

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload standalone game
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
