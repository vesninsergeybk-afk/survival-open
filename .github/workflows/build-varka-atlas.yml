name: Prepare curated rotating landscape asteroid atlas
on:
  push:
    branches: [feature/asteroid-landscape-variants-20261116]
    paths: [.github/workflows/build-varka-atlas.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the optimized 18x12 sprite atlas
        run: |
          python -m pip install --quiet pillow numpy scipy
          python arcade/tools/build-varka-atlas.py
      - name: Commit only the curated atlas and its preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/space/varkalandar/varkalandar-18x12.png assets/space/varkalandar/preview-variants.jpg
          git commit -m 'Prepare compact 18-variety rotating asteroid atlas' || exit 0
          git push origin HEAD:feature/asteroid-landscape-variants-20261116
