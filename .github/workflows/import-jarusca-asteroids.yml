name: Import verified CC0 rotating asteroid sprites
on:
  push:
    branches:
      - feature/animated-asteroids-jarusca-20261116
    paths:
      - .github/workflows/import-jarusca-asteroids.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original CC0 diffuse sprite sheet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/space
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            --header 'User-Agent: Mozilla/5.0 (compatible; SurvivorAssetImporter/1.0)' \
            --header 'Referer: https://opengameart.org/' \
            'https://opengameart.org/sites/default/files/asteroids_spritesheet_diffuse.png' \
            --output assets/space/jarusca-asteroids-diffuse.png
          file assets/space/jarusca-asteroids-diffuse.png
          test "$(stat -c%s assets/space/jarusca-asteroids-diffuse.png)" -lt 5000000
      - name: Inspect sprite sheet dimensions and alpha
        shell: bash
        run: |
          python - <<'PY'
          import struct,hashlib
          from pathlib import Path
          p=Path('assets/space/jarusca-asteroids-diffuse.png')
          data=p.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n','not a PNG'
          w,h=struct.unpack('>II',data[16:24])
          assert 0<w<=8192 and 0<h<=8192
          print('JARUSCA_ASTEROIDS_PNG_DIMENSIONS',w,h)
          print('JARUSCA_ASTEROIDS_BYTES',len(data))
          print('JARUSCA_ASTEROIDS_SHA256',hashlib.sha256(data).hexdigest())
          PY
      - name: Commit source asset on isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/space/jarusca-asteroids-diffuse.png
          if ! git diff --cached --quiet; then
            git commit -m 'Import Jarusca CC0 rotating asteroid diffuse sprites'
            git push origin HEAD:feature/animated-asteroids-jarusca-20261116
          fi
