name: Import Scott Buckley CC BY score (temporary)

on:
  push:
    branches: [feature/cinematic-score-20261103]
    paths:
      - ".github/workflows/import-licensed-music.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio encoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
      - name: Download verified originals and encode Ogg/Opus
        run: bash tools/fetch-licensed-music.sh
      - name: Keep licensed music together with its source and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/music/*.ogg
          if ! git diff --cached --quiet; then
            git commit -m "Vendor nine CC BY 4.0 cinematic compositions"
            git push origin HEAD:feature/cinematic-score-20261103
          fi
