<svg xmlns="http://www.w3.org/2000/svg" width="448" height="448" viewBox="0 0 224 224" role="img" aria-label="Ремонтный док: открытая U-образная рама, две бронированные боковые фермы и техническая платформа">
<defs>
  <linearGradient id="shell" x1=".12" y1=".04" x2=".93" y2="1">
   <stop stop-color="#657e94"/><stop offset=".16" stop-color="#344b61"/><stop offset=".51" stop-color="#1d2f42"/><stop offset=".87" stop-color="#101d30"/><stop offset="1" stop-color="#0a1728"/>
  </linearGradient>
  <linearGradient id="armor" x1="0" x2="1" y1="0" y2=".55">
   <stop stop-color="#8198a6"/><stop offset=".14" stop-color="#536c82"/><stop offset=".42" stop-color="#2b4055"/><stop offset=".84" stop-color="#203449"/><stop offset="1" stop-color="#0c1b2d"/>
  </linearGradient>
  <linearGradient id="bevel" x1="0" x2="1" y1="0" y2="1">
   <stop stop-color="#a1b6b9"/><stop offset=".34" stop-color="#66798b"/><stop offset=".58" stop-color="#2a4256"/><stop offset="1" stop-color="#15263a"/>
  </linearGradient>
  <linearGradient id="deck" x1="0" x2="0" y1="0" y2="1">
   <stop stop-color="#102032"/><stop offset=".48" stop-color="#182c3f"/><stop offset="1" stop-color="#263d4e"/>
  </linearGradient>
  <linearGradient id="groove" x1="0" y1="0" x2="1" y2="0">
   <stop stop-color="#091725"/><stop offset=".47" stop-color="#203746"/><stop offset="1" stop-color="#07131f"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- Single consistent top-down view; transparent canvas, no baked runtime light. -->
<path d="M38 31 L78 30 L79 139 L148 139 L150 30 L189 31 L186 178 L36 178 Z" transform="translate(0 6)" fill="#000a14" opacity=".55" filter="url(#shadow)"/>
<!-- Recessed maintenance bay is deliberately open toward the top. -->
<path d="M73 55 L150 55 L150 145 L73 145 Z" fill="url(#deck)" stroke="#112436" stroke-width="2"/>
<path d="M79 63 V139 H144 V63" fill="none" stroke="#3f586b" stroke-width="2" stroke-linejoin="bevel"/>
<path d="M91 69 V132 M112 69 V132 M133 69 V132" stroke="#3c5263" stroke-width="1.2" opacity=".56"/>
<path d="M79 90 H144 M79 113 H144" stroke="#426078" stroke-width=".9" opacity=".52"/>
<path d="M100 77 L112 72 L124 77 L124 92 L112 98 L100 92 Z" fill="#223d50" stroke="#66889a" stroke-width="1.5"/>
<path d="M109 83 H115 M112 80 V91" stroke="#a4ced0" stroke-width="2" opacity=".7"/>
<path d="M88 130 L98 120 M136 130 L126 120" stroke="#586f7f" stroke-width="2"/>
<!-- Structural hull: large U silhouette, uninterrupted open mouth. -->
<path d="M35 29 L69 29 L76 39 L76 137 L149 137 L149 39 L155 29 L190 29 L186 176 L38 176 Z"
 fill="url(#shell)" stroke="#081420" stroke-width="4" stroke-linejoin="round"/>
<path d="M39 34 L65 34 L71 44 V144 H154 V44 L160 34 H185 L181 171 H43 Z"
 fill="none" stroke="#99b4b8" stroke-width="1.7" opacity=".64"/>
<!-- Strong inner structural lips; dark outer volume gives the station weight. -->
<path d="M65 43 L75 48 L75 138 L68 148 L62 141 Z" fill="#7693a0" opacity=".55"/>
<path d="M160 43 L150 48 L150 138 L157 148 L163 141 Z" fill="#7693a0" opacity=".55"/>
<path d="M74 141 H151 L158 152 H66 Z" fill="#7d93a2" opacity=".61"/>
<path d="M48 45 L60 41 L66 56 L65 130 L57 138 L43 125 Z"
 fill="url(#armor)" stroke="#a0b0b0" stroke-width="1.5"/>
<path d="M177 45 L165 41 L159 56 L160 130 L168 138 L182 125 Z"
 fill="url(#armor)" stroke="#9fafb1" stroke-width="1.5"/>
<!-- Separate armored segments on each bay wall. -->
<g fill="url(#bevel)" stroke="#101d2d" stroke-width="1.7">
 <path d="M39 34 L67 34 L65 57 L43 61 L35 51 Z"/>
 <path d="M42 67 L64 62 L65 86 L42 94 Z"/>
 <path d="M42 99 L65 91 L64 118 L41 126 Z"/>
 <path d="M37 133 L66 124 L73 142 L61 162 L38 159 Z"/>
 <path d="M158 34 L186 34 L190 51 L182 61 L160 57 Z"/>
 <path d="M161 62 L183 67 L183 94 L160 86 Z"/>
 <path d="M160 91 L183 99 L184 126 L161 118 Z"/>
 <path d="M159 124 L188 133 L187 159 L164 162 L152 142 Z"/>
</g>
<!-- Extruded side ribs and control channels. -->
<path d="M47 66 L49 120" stroke="#9db9bf" stroke-width="2" opacity=".65"/>
<path d="M177 66 L175 120" stroke="#9db9bf" stroke-width="2" opacity=".65"/>
<path d="M55 67 V119 M170 67 V119" stroke="#091927" stroke-width="4"/>
<path d="M55 67 V119 M170 67 V119" stroke="#648795" stroke-width="1.3" opacity=".74"/>
<!-- Rear service block, with internal vents, recessed launch hatch. -->
<path d="M65 147 L160 147 L175 159 L171 174 L54 174 L49 159 Z"
 fill="url(#armor)" stroke="#9aadb0" stroke-width="1.8"/>
<path d="M85 150 H140 L146 166 H79 Z" fill="#0c1d2e" stroke="#607e90" stroke-width="1.5"/>
<path d="M92 154 H133" stroke="#93a8ac" stroke-width="1"/>
<path d="M95 158 H130 M98 162 H127" stroke="#2e5367" stroke-width="2"/>
<path d="M58 154 L72 154 M153 154 L167 154" stroke="#d1d5bf" stroke-width="1.8" opacity=".66"/>
<!-- Anchor sockets for real animated repair arms. -->
<g fill="#162b3d" stroke="#819aaa" stroke-width="2">
 <circle cx="62" cy="93" r="10"/><circle cx="163" cy="93" r="10"/>
</g>
<circle cx="62" cy="93" r="5" fill="#526f82" stroke="#b5c9cb" stroke-width="1"/>
<circle cx="163" cy="93" r="5" fill="#526f82" stroke="#b5c9cb" stroke-width="1"/>
<!-- Engraved construction marks: consistent metals, not a permanent power state. -->
<g fill="#ccd2c3" opacity=".72">
 <rect x="46" y="43" width="10" height="2"/><rect x="169" y="43" width="10" height="2"/>
 <rect x="46" y="110" width="10" height="2"/><rect x="169" y="110" width="10" height="2"/>
</g>
<g fill="#a7bbbd">
 <circle cx="42" cy="52" r="1.4"/><circle cx="63" cy="53" r="1.4"/>
 <circle cx="183" cy="52" r="1.4"/><circle cx="162" cy="53" r="1.4"/>
 <circle cx="45" cy="138" r="1.3"/><circle cx="180" cy="138" r="1.3"/>
 <circle cx="66" cy="164" r="1.3"/><circle cx="159" cy="164" r="1.3"/>
</g>
<!-- Hard-cut warning stripes at the mouth; silhouette stays open. -->
<path d="M72 45 L77 49 M72 53 L77 57 M148 49 L153 45 M148 57 L153 53" stroke="#d3b97b" stroke-width="2.8"/>
</svg>