<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
 <title id="title">Выживший — проверенный эскиз оружейного HUD</title>
 <desc id="desc">Схематичный игровой экран: справа в отдельном инструменте сначала показаны Пробел, G и ПКМ с временем готовности, ниже — автоматические пушки. У каждого орудия свой знак. Внизу отдельно показана свёрнутая мобильная панель с двумя способностями.</desc>
 <defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0B2439"/><stop offset=".6" stop-color="#081727"/><stop offset="1" stop-color="#050E18"/></linearGradient>
  <linearGradient id="plate" x2="0" y2="1"><stop stop-color="#173E50" stop-opacity=".96"/><stop offset="1" stop-color="#071C2B" stop-opacity=".98"/></linearGradient>
  <linearGradient id="card" x2="0" y2="1"><stop stop-color="#143D51" stop-opacity=".76"/><stop offset="1" stop-color="#0B2536" stop-opacity=".67"/></linearGradient>
  <linearGradient id="bar" x2="0" y2="0"><stop stop-color="#76DEDA"/><stop offset="1" stop-color="#B0F7E7"/></linearGradient>
 </defs>
 <rect width="1440" height="900" fill="url(#bg)"/>
