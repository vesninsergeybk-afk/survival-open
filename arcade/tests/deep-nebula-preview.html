<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка глубины космического фона</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#020915}
#sky{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 35%,#50377638 0%,transparent 58%),
 radial-gradient(ellipse at 25% 70%,#122e6244 0%,transparent 61%),url('../../assets/space/nebula_main.jpg') center / cover no-repeat}
#stars{position:fixed;inset:0;display:block;width:100%;height:100%}
</style></head>
<body><div id="sky"></div><canvas id="stars"></canvas><output id="state" hidden></output>
<script type="module">
import {CosmicAmbience} from '../cosmic-ambience.js';
const sector=Math.max(0,Math.min(4,Number(new URLSearchParams(location.search).get('sector'))||0));
const imgs=['nebula_main.jpg','nebula_azure_v1.png','nebula_amber_v1.png','nebula_lilac_v1.png','nebula_teal_v1.png'];
document.querySelector('#sky').style.backgroundImage=
 'radial-gradient(ellipse at 65% 38%,#373d7240 0%,transparent 58%),url("../../assets/space/'+imgs[sector]+'")';
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d'),cosmos=new CosmicAmbience();
canvas.width=innerWidth;canvas.height=innerHeight;
const cam={x:170,y:-100,w:canvas.width,h:canvas.height};
cosmos._drawDetails(ctx,cam,1,60,sector,false);
if(cosmos.textures){
 // Wait for local assets, then paint the same deterministic frame in both variants.
 // Headless screenshots otherwise catch only the first rAF before WebP finishes.
 await Promise.race([
  new Promise(resolve=>{
   if(cosmos.detailStates[sector]!=='loading')return resolve();
   const check=()=>cosmos.detailStates[sector]==='loading'?
      setTimeout(check,20):resolve();
   check();
  }),
  new Promise(resolve=>setTimeout(resolve,2500))
 ]);
}
ctx.clearRect(0,0,canvas.width,canvas.height);
cosmos.draw(ctx,cam,6,60,sector,false);
document.getElementById('state').textContent=JSON.stringify({
 sector,texture:cosmos.detailStates[sector],
 ready:!!cosmos.detailImages[sector],pattern:!!cosmos.detailPatterns[sector],
 textureEnabled:cosmos.textures,detailChangedAt:cosmos.detailChangedAt,
 canvas:ctx.getImageData(12,12,1,1).data[3]
});
document.body.dataset.skyReady='1';
</script></body></html>
