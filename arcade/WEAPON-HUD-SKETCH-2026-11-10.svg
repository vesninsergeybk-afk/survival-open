<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
 <title id="title">Эскиз оружейной панели «Выжившего»</title>
 <desc id="desc">Справа над боевым контуром — отдельная панель со всем установленным оружием и временем готовности. Ручное оружие, тактический импульс и прокатный модуль показываются раздельно.</desc>
